<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Dial Counter</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0b0b0d">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0d;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .counter-machine {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* The Main Interactive Control Component */
        .interactive-dial-container {
            position: relative;
            width: 270px;
            height: 270px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Multi-layered Organic Fluid Energy Discharge System */
        .glow-system {
            position: absolute;
            width: 240px;
            height: 240px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .energy-wave {
            position: absolute;
            border-radius: 50%;
            background: transparent;
            opacity: 0;
            transform: scale(0.95);
        }

        /* Base Atmosphere Core Layer */
        .wave-core {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.4) 0%, rgba(79, 172, 254, 0.1) 50%, rgba(0,0,0,0) 70%);
            filter: blur(10px);
        }

        /* Outer Layer Shockwaves */
        .wave-ring-1 {
            width: 100%;
            height: 100%;
            border: 4px solid #00f2fe;
            filter: blur(6px);
            box-shadow: 0 0 20px #00f2fe, inset 0 0 10px #00f2fe;
        }

        .wave-ring-2 {
            width: 100%;
            height: 100%;
            border: 2px solid #4facfe;
            filter: blur(12px);
            box-shadow: 0 0 30px #4facfe;
        }

        /* Animate All Layers Together on Tap */
        .radiate .wave-core { animation: core-flash 0.55s cubic-bezier(0.1, 0.8, 0.2, 1) forwards; }
        .radiate .wave-ring-1 { animation: ring-out-1 0.6s cubic-bezier(0.15, 0.75, 0.2, 1) forwards; }
        .radiate .wave-ring-2 { animation: ring-out-2 0.65s cubic-bezier(0.05, 0.82, 0.25, 1) forwards; }

        @keyframes core-flash {
            0% { opacity: 0; transform: scale(0.8); }
            20% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.3); filter: blur(25px); }
        }

        @keyframes ring-out-1 {
            0% { opacity: 0.8; transform: scale(0.96); border-width: 5px; }
            100% { opacity: 0; transform: scale(1.45); border-width: 1px; }
        }

        @keyframes ring-out-2 {
            0% { opacity: 0.6; transform: scale(0.94); }
            30% { opacity: 0.8; }
            100% { opacity: 0; transform: scale(1.6); }
        }

        /* Safety Reset Progress Arc with Glowing Neon Filter */
        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            transform: rotate(-90deg);
            pointer-events: none;
            z-index: 2;
            opacity: 0; /* Starts completely hidden */
            transition: opacity 0.25s cubic-bezier(0.2, 0, 0.3, 1);
        }

        /* Applied via JS when the 0.4s holding threshold passes */
        .progress-ring.revealed {
            opacity: 1;
        }

        .progress-ring__circle {
            stroke-dasharray: 816.81; 
            stroke-dashoffset: 816.81;
            /* Applies the native hardware-accelerated neon blur filter below */
            filter: url(#neon-glow-red); 
        }

        /* Giant Round Dial Button Face */
        .round-button-housing {
            width: 240px;
            height: 240px;
            background: #141417;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7),
                inset 0 2px 3px rgba(255, 255, 255, 0.03),
                0 0 0 12px #1a1a22;
            cursor: pointer;
            position: relative;
            border: 1px solid #222229;
            z-index: 1;
            transition: transform 0.05s ease, background-color 0.1s;
        }

        .round-button-housing:active {
            transform: scale(0.97);
            background: #0f0f12;
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.8),
                inset 0 6px 14px rgba(0, 0, 0, 0.7),
                0 0 0 12px #15151b;
        }

        /* Tumbler Window completely blended into button face */
        .tumbler-window {
            display: flex;
            height: 64px; 
            overflow: hidden;
            pointer-events: none;
        }

        .digit-col {
            position: relative;
            width: 38px;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-size: 4.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 3px 6px rgba(0,0,0,0.9);
            transform-style: preserve-3d;
        }

        .digit-slot {
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <svg style="position: absolute; width: 0; height: 0;">
        <defs>
            <filter id="neon-glow-red" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="5" result="blur1" />
                <feGaussianBlur stdDeviation="12" result="blur2" />
                <feMerge>
                    <feMergeNode in="blur2" />
                    <feMergeNode in="blur1" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>
    </svg>

    <div class="counter-machine">
        <div class="interactive-dial-container">
            
            <div class="glow-system" id="glowSystem">
                <div class="energy-wave wave-core"></div>
                <div class="energy-wave wave-ring-1"></div>
                <div class="energy-wave wave-ring-2"></div>
            </div>

            <svg class="progress-ring" id="progressRing" width="270" height="270">
                <circle class="progress-ring__circle" stroke="#ef4444" stroke-width="4" fill="transparent" r="130" cx="135" cy="135"/>
            </svg>

            <div class="round-button-housing" id="masterCountBtn">
                <div class="tumbler-window" id="tumblerWindow">
                    <div class="digit-col" id="col-0"><div class="digit-slot">0</div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let count = 0;
        let progressInterval = null;
        let holdDuration = 0;
        let isHolding = false;
        let startTime = 0;
        
        const targetHoldTime = 1500; 
        const activateDelay = 400; 

        const tumblerWindow = document.getElementById('tumblerWindow');
        const masterCountBtn = document.getElementById('masterCountBtn');
        const glowSystem = document.getElementById('glowSystem');
        const progressRing = document.getElementById('progressRing');
        const progressCircle = document.querySelector('.progress-ring__circle');
        
        const circleCircumference = 2 * Math.PI * 130;

        function updateDisplay(animate = true) {
            const countStr = count.toString();
            const currentCols = tumblerWindow.children.length;
            const targetCols = countStr.length;

            if (targetCols > currentCols) {
                for (let i = currentCols; i < targetCols; i++) {
                    const col = document.createElement('div');
                    col.className = 'digit-col';
                    col.id = `col-${i}`;
                    tumblerWindow.insertBefore(col, tumblerWindow.firstChild);
                }
            } else if (targetCols < currentCols) {
                while (tumblerWindow.children.length > targetCols) {
                    tumblerWindow.removeChild(tumblerWindow.firstChild);
                }
            }

            const reversedStr = countStr.split('').reverse().join('');
            const columns = Array.from(tumblerWindow.children).reverse();

            columns.forEach((col, index) => {
                const targetDigit = reversedStr[index];
                const currentDigit = col.lastChild ? col.lastChild.textContent : null;

                if (currentDigit !== targetDigit) {
                    if (animate) {
                        const nextSlot = document.createElement('div');
                        nextSlot.className = 'digit-slot';
                        nextSlot.textContent = targetDigit;
                        col.appendChild(nextSlot);

                        col.style.transition = 'transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.2)';
                        col.style.transform = `translateY(-64px)`;

                        setTimeout(() => {
                            col.style.transition = 'none';
                            col.style.transform = 'translateY(0)';
                            while (col.children.length > 1) {
                                col.removeChild(col.firstChild);
                            }
                        }, 180);
                    } else {
                        col.innerHTML = `<div class="digit-slot">${targetDigit}</div>`;
                    }
                }
            });
        }

        function triggerRadiatingGlow() {
            glowSystem.classList.remove('radiate');
            void glowSystem.offsetWidth; 
            glowSystem.classList.add('radiate');
        }

        function setProgress(percent) {
            const offset = circleCircumference - (percent / 100) * circleCircumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        function onPointerDown(e) {
            e.preventDefault();
            isHolding = true;
            startTime = Date.now();
            holdDuration = 0;
            setProgress(0);
            progressRing.classList.remove('revealed');

            // Single unified high-performance event tracking loop
            progressInterval = setInterval(() => {
                if (!isHolding) return;
                
                holdDuration = Date.now() - startTime;
                
                // Calculate the real current layout ratio
                const percent = (holdDuration / targetHoldTime) * 100;
                setProgress(Math.min(percent, 100));

                // Fade the neon line in cleanly only after passing 0.4s threshold
                if (holdDuration >= activateDelay && !progressRing.classList.contains('revealed')) {
                    progressRing.classList.add('revealed');
                }

                if (holdDuration >= targetHoldTime) {
                    executeReset();
                }
            }, 16); // ~60fps layout refresh rate
        }

        function onPointerUp(e) {
            if (!isHolding) return;
            
            clearInterval(progressInterval);
            const absoluteTrackedTime = Date.now() - startTime;
            
            // If the user lifts their finger before 250ms, it's explicitly a standard click action
            if (absoluteTrackedTime < 250) {
                count++;
                updateDisplay(true);
                triggerRadiatingGlow();
            }
            
            isHolding = false;
            progressRing.classList.remove('revealed');
            setTimeout(() => { if(!isHolding) setProgress(0); }, 200); // Allow fadeout before zeroing line
        }

        function cancelHold() {
            isHolding = false;
            clearInterval(progressInterval);
            progressRing.classList.remove('revealed');
            setProgress(0);
        }

        function executeReset() {
            isHolding = false;
            clearInterval(progressInterval);
            count = 0;
            updateDisplay(false);
            progressRing.classList.remove('revealed');
            setProgress(0);
        }

        masterCountBtn.addEventListener('mousedown', onPointerDown);
        masterCountBtn.addEventListener('mouseup', onPointerUp);
        masterCountBtn.addEventListener('mouseleave', cancelHold);

        masterCountBtn.addEventListener('touchstart', onPointerDown, { passive: false });
        masterCountBtn.addEventListener('touchend', onPointerUp);
        masterCountBtn.addEventListener('touchcancel', cancelHold);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker running.'))
                    .catch(err => console.log('Service Worker failed:', err));
            });
        }
    </script>
</body>
</html>
